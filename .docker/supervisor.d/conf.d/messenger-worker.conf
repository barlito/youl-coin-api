[program:messenger-consume]
command=php /app/bin/console messenger:consume async_transaction outbox --time-limit=3600
user=www
numprocs=1
; startsecs=0 restarted a worker that cannot reach RabbitMQ every second, forever:
; it must stay up 5s to count as started, retries back off (1s, 2s, ... 20s) then go FATAL,
; which fails the pgrep healthcheck so Swarm replaces the task instead of hiding the loop
startsecs=5
startretries=20
autostart=true
autorestart=true
stopwaitsecs=10
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
