name: Code Quality Workflow

on:
  workflow_call:

jobs:

  code_quality:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Setup castor
        uses: castor-php/setup-castor@v1.1.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          # Mounted into the php container as its composer download cache (docker-compose-ci.yml)
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # exposes ACTIONS_RUNTIME_TOKEN / cache URLs to docker compose for the gha layer cache
      - name: Expose GitHub runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Deploy stack
        run: USER_ID=$(id -u) GROUP_ID=$(id -g) make deploy.ci github_token=${{ secrets.GITHUB_TOKEN }}

      # /app is bind-mounted: the tools write their caches on the runner, as the runner uid
      # phpcs resolves its cache next to the barlito/utils ruleset, not in the cwd
      - name: Cache quality tools
        uses: actions/cache@v6
        with:
          path: |
            var/cache/phpstan
            .php-cs-fixer.cache
            vendor/barlito/utils/config/.phpcs-cache
          key: quality-${{ hashFiles('composer.lock', 'phpstan.dist.neon', 'phpstan-baseline.neon') }}-${{ github.sha }}
          restore-keys: |
            quality-${{ hashFiles('composer.lock', 'phpstan.dist.neon', 'phpstan-baseline.neon') }}-
            quality-

      - name: Run php cs fixer
        run: make cs_fixer.dry_run

      - name: Run php cs
        run: make phpcs

      - name: Run phpstan
        run: make phpstan

      - name: Undeploy stack
        run: make docker.undeploy.ci
