name: Code Quality Workflow

on:
  workflow_call:

jobs:

  code_quality:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Setup castor
        uses: castor-php/setup-castor@v1.1.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          # Mounted into the php container as its composer download cache (docker-compose-ci.yml)
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Deploy stack
        run: USER_ID=$(id -u) GROUP_ID=$(id -g) make deploy.ci github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Run php cs fixer
        run: make cs_fixer.dry_run

      - name: Run php cs
        run: make phpcs

      # /app is bind-mounted: PHPStan's result cache (tmpDir) lands in var/cache/phpstan on the runner
      - name: Cache PHPStan result
        uses: actions/cache@v6
        with:
          path: var/cache/phpstan
          key: phpstan-${{ github.sha }}
          restore-keys: phpstan-

      - name: Run phpstan
        run: make phpstan

      - name: Undeploy stack
        run: make docker.undeploy.ci
