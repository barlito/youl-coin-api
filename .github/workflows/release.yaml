name: release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  release:
    uses: barlito/ci/.github/workflows/docker-release.yaml@v1
    with:
      dockerfile: .docker/Dockerfile
      images: '[{"name":"youl-coin-api","target":"frankenphp_prod"},{"name":"youl-coin-worker","target":"frankenphp_worker_prod"}]'
    secrets: inherit
