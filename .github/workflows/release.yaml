name: Release Workflow

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # buildcache is written to GHCR (native GITHUB_TOKEN login)
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'

      # Registry cache on GHCR, shared by every tag; on Docker Hub each cached layer counted against the pull quota
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_READ_WRITE_DELETE_ACCESS_TOKEN }}

      - name: Login to GHCR (buildcache)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Main Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/Dockerfile
          target: frankenphp_prod
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/youl-coin-api:${{ github.ref_name }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/youl-coin-api:latest
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

      # The worker image extends frankenphp_prod: it only reads the main image's cache
      - name: Build & Push Worker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/Dockerfile
          target: frankenphp_worker_prod
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/youl-coin-worker:${{ github.ref_name }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/youl-coin-worker:latest
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
