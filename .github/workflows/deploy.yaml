name: Deploy Workflow

on:
  workflow_dispatch:
    inputs:
      re-deploy:
        description: "Stack deploy complet (applique tout docker-compose-prod.yml, rolling update avec rollback) au lieu de la seule mise à jour d'image"
        required: true
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A crash-looping container must not keep the job spinning
    timeout-minutes: 15

    env:
      DOCKER_HOST: ssh://${{ vars.SERVER_USERNAME }}@${{ vars.SERVER_HOST }}:${{ vars.SERVER_PORT }}
      # Substitués dans docker-compose-prod.yml au moment du stack deploy
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      AMQP_USER: ${{ secrets.AMQP_USER }}
      AMQP_PASS: ${{ secrets.AMQP_PASS }}
      DISCORD_DSN: ${{ secrets.DISCORD_DSN }}
      OAUTH_DISCORD_CLIENT_ID: ${{ secrets.OAUTH_DISCORD_CLIENT_ID }}
      OAUTH_DISCORD_CLIENT_SECRET: ${{ secrets.OAUTH_DISCORD_CLIENT_SECRET }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      JWT_PASSPHRASE: ${{ secrets.JWT_PASSPHRASE }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      YTCG_WEBHOOK_SECRET: ${{ secrets.YTCG_WEBHOOK_SECRET }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Setup castor
        uses: castor-php/setup-castor@v1.1.0

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ vars.SERVER_PORT }} ${{ vars.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_READ_WRITE_DELETE_ACCESS_TOKEN }}

      - name: Re-Deploy Stack
        if: inputs.re-deploy
        # No `stack rm`: deploy.prod rolls the existing stack (creates it on a first deploy)
        run: TAG=$GITHUB_REF_NAME make deploy.prod

      - name: Drain & stop worker
        if: ${{ ! inputs.re-deploy }}
        run: docker service scale youl_coin_message_worker=0

      - name: Update main service + migrate
        if: ${{ ! inputs.re-deploy }}
        run: |
          make db.backup
          make docker.service.update args="--image barlito/youl-coin-api:$GITHUB_REF_NAME youl_coin_php"
          TAG=$GITHUB_REF_NAME make deploy.assert_image
          make doctrine.migrate

      - name: Update & restart worker
        if: ${{ ! inputs.re-deploy }}
        run: |
          make docker.service.update args="--image barlito/youl-coin-worker:$GITHUB_REF_NAME youl_coin_message_worker"
          docker service scale youl_coin_message_worker=2
          TAG=$GITHUB_REF_NAME make deploy.assert_image assert_service=message_worker assert_image_name=barlito/youl-coin-worker

      - name: Smoke test
        if: ${{ ! inputs.re-deploy }}
        run: make smoke.test

      - name: Remove stopped containers
        if: ${{ ! inputs.re-deploy }}
        run: make deploy.prune
