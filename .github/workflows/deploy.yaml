name: deploy

on:
  workflow_dispatch:
    inputs:
      re-deploy:
        description: Full stack deploy (applies the whole docker-compose-prod.yml) instead of the image update only
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: barlito/ci/.github/workflows/swarm-deploy.yaml@v1
    with:
      full: ${{ inputs.re-deploy }}
      images: barlito/youl-coin-api barlito/youl-coin-worker
      env-secrets: DB_USER DB_PASSWORD AMQP_USER AMQP_PASS DISCORD_DSN OAUTH_DISCORD_CLIENT_ID OAUTH_DISCORD_CLIENT_SECRET JWT_PUBLIC_KEY JWT_SECRET_KEY JWT_PASSPHRASE APP_SECRET YTCG_WEBHOOK_SECRET
      castor: true
    secrets: inherit
