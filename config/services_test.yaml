services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    App\Tests\Behat\:
        resource: '../tests/Behat/*'

    App\Tests\Functional\:
        resource: '../tests/Functional/*'

    App\Tests\Unit\:
        resource: '../tests/Unit/*'

    # Services

    # Depuis PHPUnit 10, TestCase::__construct(string $name) est final et $name
    # obligatoire : les contexts Behat qui héritent de KernelTestCase/WebTestCase/
    # ApiTestCase doivent recevoir cet argument explicitement.
    App\Tests\Behat\DemoContext:
        arguments: ['DemoContext']

    App\Tests\Behat\InMemoryContext:
        arguments: ['InMemoryContext']

    App\Tests\Behat\MessengerContext:
        arguments: ['MessengerContext']

    App\Tests\Behat\AuthContext:
        arguments: ['AuthContext']

    App\Tests\Behat\FormContext:
        arguments: ['FormContext']

    App\Tests\Behat\ApiContext:
        arguments: ['ApiContext']

    App\Tests\Behat\EntityManagerContext:
        $entityNamespace: App\Entity

    App\Tests\Behat\Mock\LoggerMock:
        decorates: Psr\Log\LoggerInterface
        arguments:
            - '@App\Tests\Behat\Mock\LoggerMock.inner'

    App\Tests\Behat\Mock\TransactionNotifierMock:
        decorates: App\Service\Notifier\Transaction\Abstract\Interface\TransactionNotifierInterface
        arguments:
            - '@App\Tests\Behat\Mock\TransactionNotifierMock.inner'
