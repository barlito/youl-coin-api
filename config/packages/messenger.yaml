framework:
    messenger:
        buses:
            messenger.bus.default:
                middleware:
                    - doctrine_transaction
                    - App\Service\Messenger\Middleware\LoggerMiddleware

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async_transaction:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                serializer: App\Service\Messenger\Serializer\TransactionMessageSerializer
                retry_strategy:
                    max_retries: 0
                options:
                    persistent: true
                    exchange:
                        name: transaction_exchange
                    queues:
                        messages_transaction: ~

            transaction_notification:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                serializer: App\Service\Messenger\Serializer\TransactionNotificationSerializer
                options:
                    persistent: true
                    exchange:
                        name: transaction_notification_exchange
                    queues: []

            # Transactional outbox: written in the money movement's DB transaction, consumed by the worker
            outbox:
                dsn: 'doctrine://default?queue_name=outbox&auto_setup=false'
                failure_transport: failed
                retry_strategy:
                    max_retries: 5
                    delay: 5000
                    multiplier: 3

            failed:
                dsn: 'doctrine://default?queue_name=failed&auto_setup=false'

        routing:
            # Route your messages to the transports
            'App\Message\TransactionMessage': async_transaction
            'App\Entity\Transaction': transaction_notification
            'App\Message\TransactionCommitted': outbox
